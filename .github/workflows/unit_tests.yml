name: Unit Tests
# This repository restricts labeling to maintainers, who use the test label to authorize a fork commit.
on: # zizmor: ignore[dangerous-triggers]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - src/telegram/**
      - tests/**
      - .github/workflows/unit_tests.yml
      - pyproject.toml
  pull_request_target:
    types: [labeled]
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.id || 'automatic' }}
  cancel-in-progress: true

jobs:
  pytest:
    # Same-repository PRs and master pushes run the full suite with CI credentials.
    # Fork PRs run offline by default. The `contrib: safe for tests` label requests a live run.
    if: >-
      github.event_name != 'pull_request_target' || (
        github.event.label.name == 'contrib: safe for tests'
        && github.event.pull_request.state == 'open'
        && github.event.pull_request.head.repo.full_name != ''
        && github.event.pull_request.head.repo.full_name != github.repository
        && github.event.pull_request.head.sha != ''
      )
    name: pytest
    runs-on: ${{matrix.os}}
    env:
      IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - python-version: '3.15t'
            os: ubuntu-latest
      fail-fast: False
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          # The job condition limits this checkout to the commit in the maintainer's label event.
          allow-unsafe-pr-checkout: ${{ github.event_name == 'pull_request_target' }}
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          # Keep fork dependency installs out of the default branch's cache.
          cache: ${{ github.event_name != 'pull_request_target' && 'pip' || '' }}
      - name: Install dependencies
        run: |
          python -W ignore -m pip install --upgrade pip
          python -W ignore -m pip install . --group tests

      - name: Test with pytest
        # We run 4 different suites here
        # 1. Test just utils.datetime.py without pytz being installed
        # 2. Test just test_no_passport.py without passport dependencies being installed
        # 3. Test just test_rate_limiter.py without passport dependencies being installed
        # 4. Test everything else
        # The first & second one are achieved by mocking the corresponding import
        # See test_helpers.py & test_no_passport.py for details
        run: |
          pytest_args=()
          if [[ -z "$BOTS" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == 'pull_request_target' ]]; then
              echo '::error::Approved fork tests require the BOTS secret.'
              exit 1
            fi
            # The bot fixture expects base64-encoded JSON when BOTS is set.
            unset BOTS
            pytest_args=(-m no_req)
          fi

          # Mask bot tokens and payment provider tokens in the logs.
          # Needs to be run before pytest so Github knows about them
          python -c '
          import base64
          import json
          import os

          def mask(value):
              if not value:
                  return
              print(f"::add-mask::{value}")

          bots = os.environ.get("BOTS")
          mask(bots)
          if bots:
              for bot in json.loads(base64.b64decode(bots).decode("utf-8")):
                  for key in ("token", "payment_provider_token"):
                      mask(bot.get(key))
          '

          # We test without optional dependencies first. This includes:
          # - without pytz
          # - without jobqueue
          # - without ratelimiter
          # - without webhooks
          # - without arbitrary callback data
          # - without socks support
          # - without http2 support
          TO_TEST="test_no_passport.py or test_datetime.py or test_defaults.py or test_jobqueue.py or test_applicationbuilder.py or test_ratelimiter.py or test_updater.py or test_callbackdatacache.py or test_request.py"
          pytest -v --cov "${pytest_args[@]}" -k "${TO_TEST}" --junit-xml=.test_report_no_optionals_junit.xml
          opt_dep_status=$?
          
          # Test the rest
          export TEST_WITH_OPT_DEPS='true'
          pip install .[all]
          # `-n auto --dist worksteal` uses pytest-xdist to run tests on multiple CPU
          # workers. Increasing number of workers has little effect on test duration, but it seems
          # to increase flakyness.
          pytest -v --cov --cov-append "${pytest_args[@]}" -n auto --dist worksteal --junit-xml=.test_report_optionals_junit.xml
          main_status=$?
          # exit with non-zero status if any of the two pytest runs failed
          exit $(( ${opt_dep_status} || ${main_status} ))
        env:
          JOB_INDEX: ${{ strategy.job-index }}
          BOTS: ${{ env.IS_FORK_PR == 'false' && secrets.BOTS || '' }}
          TEST_WITH_OPT_DEPS : "false"
          TEST_BUILD: "true"
        shell: bash --noprofile --norc {0}

      - name: Test Summary
        id: test_summary
        uses: test-summary/action@31493c76ec9e7aa675f1585d3ed6f1da69269a86 # v2.4
        if: always()  # always run, even if tests fail
        with:
          paths: |
            .test_report_no_optionals_junit.xml
            .test_report_optionals_junit.xml

      - name: Submit coverage
        if: env.IS_FORK_PR == 'false' && github.event_name != 'pull_request_target'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          env_vars: OS,PYTHON
          name: ${{ matrix.os }}-${{ matrix.python-version }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        if: ${{ !cancelled() && env.IS_FORK_PR == 'false' && github.event_name != 'pull_request_target' }}
        with:
          files: .test_report_no_optionals_junit.xml,.test_report_optionals_junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
